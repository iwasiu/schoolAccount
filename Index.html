<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Account Management System</title>

    <!-- ============================================================
         AUTO-REDIRECT — fires immediately on page load
         Replace YOUR_APPS_SCRIPT_URL with your actual
         https://script.google.com/macros/s/.../exec URL
         ============================================================ -->
    <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbwaSNUA3soEaIwiuR4obnG74v1pxEfQkp1jzAGKIj7sy4-6v-6jGHFbKKr0z4nYgJp9/exec">

    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f7fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
        h1 { color: #1a237e; margin-bottom: 10px; }
        p { color: #455a64; margin-bottom: 25px; line-height: 1.5; }
        .btn { display: inline-block; padding: 14px 30px; background: #1a237e; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; transition: background 0.2s; }
        .btn:hover { background: #283593; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #d0d7e2; border-top-color: #1a237e; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: -3px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status { font-size: 0.85rem; color: #78909c; margin-bottom: 20px; }
    </style>

    <!-- ============================================================
         JS FALLBACK — fires immediately too, for browsers that
         ignore meta-refresh (rare but real: some privacy extensions)
         ============================================================ -->
    <script>
        // Only redirect if we haven't already been redirected in this
        // browser session (prevents an infinite loop if the Apps
        // Script URL itself ever redirects back here).
        (function () {
            if (sessionStorage.getItem('redirected_to_apps_script') === 'yes') {
                sessionStorage.removeItem('redirected_to_apps_script');
                return; // stop — don't redirect again
            }
            sessionStorage.setItem('redirected_to_apps_script', 'yes');
            window.location.replace('https://script.google.com/macros/s/AKfycbwaSNUA3soEaIwiuR4obnG74v1pxEfQkp1jzAGKIj7sy4-6v-6jGHFbKKr0z4nYgJp9/exec');
        })();
    </script>
</head>
<body>
    <div class="card">
        <h1>School Account</h1>
        <p class="status">
            <span class="spinner"></span>
            Redirecting to the system…
        </p>
        <p style="font-size:0.8rem;color:#90a4ae;">
            If you are not redirected automatically within a few seconds,
            click the button below.
        </p>
        <!-- Fallback button — still present for slow connections -->
        <a href="https://script.google.com/macros/s/AKfycbwaSNUA3soEaIwiuR4obnG74v1pxEfQkp1jzAGKIj7sy4-6v-6jGHFbKKr0z4nYgJp9/exec" class="btn" target="_top">Enter System →</a>
    </div>
</body>
</html>
