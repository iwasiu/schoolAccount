<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Account Management System</title>

    <!-- ============================================================
         AUTO-REDIRECT — fires on page load
         Replace YOUR_APPS_SCRIPT_URL with your real /exec URL:
         https://script.google.com/macros/s/AKfycb…/exec
         ============================================================ -->
    <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbwaSNUA3soEaIwiuR4obnG74v1pxEfQkp1jzAGKIj7sy4-6v-6jGHFbKKr0z4nYgJp9/exec">

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #fff;
            padding: 36px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        h1 {
            color: #1a237e;
            margin: 0 0 16px;
            font-size: 1.4rem;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #d0d7e2;
            border-top-color: #1a237e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: -3px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status {
            font-size: 0.9rem;
            color: #455a64;
            margin: 0 0 20px;
        }
        .hint {
            font-size: 0.78rem;
            color: #90a4ae;
            margin: 0 0 20px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: #1a237e;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.92rem;
            transition: background 0.2s;
        }
        .btn:hover { background: #283593; }
    </style>

    <script>
        // JS redirect — fires before the <body> even paints, so this
        // page is rarely seen. Fallback for browsers that ignore
        // <meta refresh> (some privacy extensions block it).
        //
        // sessionStorage guard prevents an infinite redirect loop if
        // the Apps Script URL ever redirects back here.
        (function () {
            try {
                if (sessionStorage.getItem('redirected_to_apps_script') === 'yes') {
                    sessionStorage.removeItem('redirected_to_apps_script');
                    return;
                }
                sessionStorage.setItem('redirected_to_apps_script', 'yes');
            } catch (e) {
                // sessionStorage blocked (private mode edge case) — proceed anyway
            }
            window.location.replace('https://script.google.com/macros/s/AKfycbwaSNUA3soEaIwiuR4obnG74v1pxEfQkp1jzAGKIj7sy4-6v-6jGHFbKKr0z4nYgJp9/exec');
        })();
    </script>
</head>
<body>
    <div class="card">
        <h1>School Account</h1>
        <p class="status">
            <span class="spinner"></span>
            Opening the system…
        </p>
        <p class="hint">
            If nothing happens after 3 seconds, tap the button below.
        </p>
        <a href="https://script.google.com/macros/s/AKfycbwaSNUA3soEaIwiuR4obnG74v1pxEfQkp1jzAGKIj7sy4-6v-6jGHFbKKr0z4nYgJp9/exec" class="btn">Enter System →</a>
    </div>
</body>
</html>
